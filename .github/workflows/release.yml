name: Release

# Every push to main: compute the next 0.x.y from Conventional Commits (D-019). When something
# user-facing changed, build the release APK signed with the secret key (D-026) and publish it as
# GitHub release v0.x.y with veil.apk, which the in-app updater installs. Never tag by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create the tag and release

# One run at a time: a queued push computes its version only after the previous release tagged.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0 # tags + history for the version bump

      - name: Version
        run: |
          V=$(.github/scripts/next-version.sh)
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "Version: $V"
          if [ "$V" != none ]; then
            .github/scripts/release-notes.sh > release-notes.md
            cat release-notes.md
          fi

      - name: Check signing secrets
        if: env.VERSION != 'none'
        env:
          KS: ${{ secrets.VEIL_KEYSTORE_B64 }}
          PW: ${{ secrets.VEIL_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::VEIL_KEYSTORE_B64 / VEIL_KEYSTORE_PASSWORD secrets are missing"
            exit 1
          fi

      - uses: actions/setup-java@v4
        if: env.VERSION != 'none'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        if: env.VERSION != 'none'

      - name: Install NDK and CMake
        if: env.VERSION != 'none'
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;29.0.14206865" "cmake;3.31.6"

      - name: Build signed release APK
        if: env.VERSION != 'none'
        env:
          VEIL_KEYSTORE_PATH: ${{ runner.temp }}/veil-release.jks
          VEIL_KEYSTORE_PASSWORD: ${{ secrets.VEIL_KEYSTORE_PASSWORD }}
          VEIL_KEYSTORE_B64: ${{ secrets.VEIL_KEYSTORE_B64 }}
        run: |
          trap 'rm -f "$VEIL_KEYSTORE_PATH"' EXIT
          printf '%s' "$VEIL_KEYSTORE_B64" | base64 -d > "$VEIL_KEYSTORE_PATH"
          ./gradlew assembleRelease -PveilVersion="$VERSION" --console=plain
          cp app/build/outputs/apk/release/app-release.apk veil.apk

      # Fails on an unsigned APK. The certificate digest is Veil's identity: it must never change.
      - name: Verify signature
        if: env.VERSION != 'none'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs veil.apk
          ls -la veil.apk

      - uses: softprops/action-gh-release@v3
        if: env.VERSION != 'none'
        with:
          tag_name: v${{ env.VERSION }}
          name: Veil ${{ env.VERSION }}
          body_path: release-notes.md
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: veil.apk
