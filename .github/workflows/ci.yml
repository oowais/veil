name: CI

on:
  push:
    branches: [main]
    # Docs-only pushes skip CI; a push touching anything else still runs it.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;29.0.14206865" "cmake;3.31.6"

      - name: Lint, unit tests, builds
        run: ./gradlew lint testDebugUnitTest assembleDebug assembleProfile assembleRelease --console=plain

      # app-debug.apk: debuggable, for crash traces. app-profile.apk: optimised, for timings.
      # Both are signed with the committed debug key, so either installs over the other.
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: veil-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/profile/app-profile.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: '**/build/reports/'
