name: CI

# One build per push/PR (D-032): lint, unit tests and the release APK, built once. On a push to
# main with a user-facing commit since the last tag, that APK is signed with the secret key (D-026)
# and the release job publishes it as v0.x.y (D-019). The release job only runs after the build
# passed, so a failing lint or test never ships. Never tag by hand.
on:
  push:
    branches: [main]
    # Docs-only pushes skip CI; nothing user-facing changed, so there is nothing to release either.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time: a queued main push computes its version only after the previous
# release tagged. PR runs replace each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # bergamot-translator nests Marian and its libraries
          fetch-depth: 0 # tags + history for the version bump

      # Next 0.x.y from Conventional Commits; "none" when nothing user-facing changed since the tag.
      # Only pushes to main release.
      - name: Version
        id: version
        run: |
          V=$(.github/scripts/next-version.sh)
          R=false
          if [ "$V" != none ] && [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            R=true
            .github/scripts/release-notes.sh > release-notes.md
            cat release-notes.md
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "RELEASE=$R" >> "$GITHUB_ENV"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "release=$R" >> "$GITHUB_OUTPUT"
          echo "Version: $V, release: $R"

      - name: Check signing secrets
        if: env.RELEASE == 'true'
        env:
          KS: ${{ secrets.VEIL_KEYSTORE_B64 }}
          PW: ${{ secrets.VEIL_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::VEIL_KEYSTORE_B64 / VEIL_KEYSTORE_PASSWORD secrets are missing"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;29.0.14206865" "cmake;3.31.6"

      # The release APK is unsigned unless this run releases; then it gets the version and the key.
      - name: Lint, unit tests, release APK
        env:
          VEIL_KEYSTORE_B64: ${{ env.RELEASE == 'true' && secrets.VEIL_KEYSTORE_B64 || '' }}
          VEIL_KEYSTORE_PASSWORD: ${{ env.RELEASE == 'true' && secrets.VEIL_KEYSTORE_PASSWORD || '' }}
        run: |
          ARGS=()
          if [ "$RELEASE" = true ]; then
            export VEIL_KEYSTORE_PATH="$RUNNER_TEMP/veil-release.jks"
            trap 'rm -f "$VEIL_KEYSTORE_PATH"' EXIT
            printf '%s' "$VEIL_KEYSTORE_B64" | base64 -d > "$VEIL_KEYSTORE_PATH"
            ARGS+=(-PveilVersion="$VERSION")
          fi
          ./gradlew lint testDebugUnitTest assembleRelease "${ARGS[@]}" --console=plain

      # Fails on an unsigned APK. The certificate digest is Veil's identity: it must never change.
      - name: Verify signature
        if: env.RELEASE == 'true'
        run: |
          cp app/build/outputs/apk/release/app-release.apk veil.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs veil.apk
          ls -la veil.apk

      - uses: actions/upload-artifact@v4
        if: env.RELEASE == 'true'
        with:
          name: veil-release
          path: |
            veil.apk
            release-notes.md
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: '**/build/reports/'

  release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: veil-release

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Veil ${{ needs.build.outputs.version }}
          body_path: release-notes.md
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: veil.apk
